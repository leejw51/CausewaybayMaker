[package]
name = "qwen35"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
mlx-rs = { version = "0.32.0", features = ["safetensors"] }
mlx-sys = "0.6.0"
serde_json = "1.0.151"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
# Speech to text (src/audio): microphone capture, WAV files, Whisper weights, clean shutdown.
cpal = "0.18"
half = "2"
hound = "3.5"
libc = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }
